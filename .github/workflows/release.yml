name: Release

# Publier une version :  npm version patch|minor|major  puis  git push --follow-tags
# Le tag vX.Y.Z déclenche : build → release GitHub (zip) → déploiement GitHub Pages.
# Sans terminal (ex. depuis le téléphone) : changer la version de package.json sur master
# suffit, ou Actions → Release → « Run workflow » sur master. Le tag v<version> et la
# release sont créés s'ils n'existent pas encore.
on:
  push:
    tags: ['v*']
    branches: [master]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Version
        id: version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$PKG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ≠ version package.json ($PKG)"; exit 1
          fi
          echo "tag=$PKG" >> "$GITHUB_OUTPUT"
          # Push sur master : rien à faire si cette version est déjà publiée
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]] && git rev-parse -q --verify "refs/tags/$PKG" >/dev/null; then
            echo "Version $PKG déjà publiée"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Cache des assets entre les releases : le script ne télécharge que ce qui manque
      - uses: actions/cache@v4
        if: steps.version.outputs.skip != 'true'
        with:
          path: public/tcg-cache
          key: tcg-cache-${{ hashFiles('src/data/boosters.ts') }}
          restore-keys: tcg-cache-

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Archive
        if: steps.version.outputs.skip != 'true'
        run: cd dist && zip -r ../pokemon-tcg-${{ steps.version.outputs.tag }}.zip .

      # Lancement manuel : la release (et son tag) n'est créée que depuis master
      - name: Release GitHub
        if: steps.version.outputs.skip != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: pokemon-tcg-${{ steps.version.outputs.tag }}.zip
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.version.outputs.skip != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
