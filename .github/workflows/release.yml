name: Release

# Publier une version :  npm version patch|minor|major  puis  git push --follow-tags
# Le tag vX.Y.Z déclenche : build → release GitHub (zip) → déploiement GitHub Pages.
# Sans terminal (ex. depuis le téléphone) : Actions → Release → « Run workflow » sur master
# crée le tag v<version de package.json> et la release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Version
        id: version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$PKG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ≠ version package.json ($PKG)"; exit 1
          fi
          echo "tag=$PKG" >> "$GITHUB_OUTPUT"

      # Cache des assets entre les releases : le script ne télécharge que ce qui manque
      - uses: actions/cache@v4
        with:
          path: public/tcg-cache
          key: tcg-cache-${{ hashFiles('src/data/boosters.ts') }}
          restore-keys: tcg-cache-

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Archive
        run: cd dist && zip -r ../pokemon-tcg-${{ steps.version.outputs.tag }}.zip .

      # Lancement manuel : la release (et son tag) n'est créée que depuis master
      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: pokemon-tcg-${{ steps.version.outputs.tag }}.zip
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
